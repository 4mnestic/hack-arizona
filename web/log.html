<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Spray log · SprayWait</title>
  <meta name="description" content="Download the time-stamped record of weather readings, spray decisions, and what triggered each alert.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Spray log · SprayWait">
  <meta property="og:description" content="Download the time-stamped record of weather readings, spray decisions, and what triggered each alert.">
  <meta property="og:image" content="https://spraywait.onrender.com/icons/icon-512.png">
  <meta property="og:url" content="https://spraywait.onrender.com/log">
  <meta name="theme-color" content="#14181c">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/style.css">
  <style>
    .download { display: grid; gap: 6px; margin-top: 20px; }
    .download .button { justify-content: center; font-size: 1.05rem; font-weight: 600; min-height: 56px; }
    .download.primary .button { background: var(--text); color: var(--bg); border-color: var(--text); }
    .log-table td { font-size: 0.9rem; vertical-align: top; }
    .log-table tr.changed td { font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1><img class="logo" src="/icons/logo.svg" alt="" width="122" height="56">Spray log</h1>
      <a class="small" href="/">Back</a>
    </header>
    <p class="muted">Time-stamped record of every weather reading checked, the decision, and what triggered each alert. Opens in any spreadsheet.</p>

    <div class="download primary">
      <a class="button" href="/api/log.csv?mode=live" download>Download CSV</a>
      <span id="live-info" class="muted small center"></span>
    </div>

    <div class="download">
      <a class="button" href="/api/log.csv?mode=demo" download>Download demo log</a>
      <span id="demo-info" class="muted small center"></span>
    </div>

    <h2>Recent (live)</h2>
    <p id="empty" class="muted small" hidden>No entries yet.</p>
    <table class="levels log-table">
      <thead><tr><th>Time</th><th>Pesticide</th><th>Status</th><th>Triggered by</th></tr></thead>
      <tbody id="entries"></tbody>
    </table>

    <footer class="muted small">Advisory only. The pesticide label is the law.</footer>
  </main>
  <script src="/log.js"></script>
</body>
</html>
