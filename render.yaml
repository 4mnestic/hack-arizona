# Render Blueprint: New > Blueprint in the Render dashboard, pick this repo.
services:
  - type: web
    name: spraywait
    runtime: python
    plan: free
    branch: dev
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FARM_WEATHER   # mesonet = replay data/mesonet_data_files.csv in real time; dummy = synthetic; push = real station posts to /api/readings
        value: mesonet
      - key: MESONET_SHIFT_HOURS   # replay 45 min ahead: data from 4:10 pm Arizona, recorded evening inversion until ~7:30 pm
        value: "0.75"
      - key: FARM_API_KEY
        generateValue: true
