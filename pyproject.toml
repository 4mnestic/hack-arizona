[project]
name = "spraywait"
version = "0.1.0"
description = "SprayWait: drift-risk decision support for orchard pesticide spraying"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn"]

[project.optional-dependencies]
dev = ["httpx", "pytest", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
