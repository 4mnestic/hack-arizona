[project]
name = "spraywait"
version = "0.1.0"
description = "Spray or Wait? - drift-risk decision support for orchard pesticide application"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn"]

[project.optional-dependencies]
dev = ["httpx", "pytest", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
